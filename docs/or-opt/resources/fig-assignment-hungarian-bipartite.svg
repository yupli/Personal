<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200" role="img" aria-label="Bipartite assignment optimal matching">
  <rect width="440" height="200" fill="#fafafa"/>
  <text x="220" y="22" text-anchor="middle" font-size="14" font-family="system-ui,sans-serif" fill="#222">Min-cost assignment: optimal pairs (thick)</text>
  <text x="95" y="58" text-anchor="middle" font-size="12" font-family="system-ui,sans-serif" fill="#444">Workers</text>
  <circle cx="95" cy="85" r="18" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="95" y="90" text-anchor="middle" font-size="13" font-family="system-ui,sans-serif" fill="#0d47a1">W1</text>
  <circle cx="95" cy="130" r="18" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="95" y="135" text-anchor="middle" font-size="13" font-family="system-ui,sans-serif" fill="#0d47a1">W2</text>
  <circle cx="95" cy="175" r="18" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="95" y="180" text-anchor="middle" font-size="13" font-family="system-ui,sans-serif" fill="#0d47a1">W3</text>
  <text x="345" y="58" text-anchor="middle" font-size="12" font-family="system-ui,sans-serif" fill="#444">Jobs</text>
  <circle cx="345" cy="85" r="18" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="345" y="90" text-anchor="middle" font-size="13" font-family="system-ui,sans-serif" fill="#e65100">J1</text>
  <circle cx="345" cy="130" r="18" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="345" y="135" text-anchor="middle" font-size="13" font-family="system-ui,sans-serif" fill="#e65100">J2</text>
  <circle cx="345" cy="175" r="18" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="345" y="180" text-anchor="middle" font-size="13" font-family="system-ui,sans-serif" fill="#e65100">J3</text>
  <g stroke="#bdbdbd" stroke-width="1.2" fill="none">
    <line x1="113" y1="85" x2="327" y2="85"/>
    <line x1="113" y1="85" x2="327" y2="130"/>
    <line x1="113" y1="85" x2="327" y2="175"/>
    <line x1="113" y1="130" x2="327" y2="85"/>
    <line x1="113" y1="130" x2="327" y2="130"/>
    <line x1="113" y1="130" x2="327" y2="175"/>
    <line x1="113" y1="175" x2="327" y2="85"/>
    <line x1="113" y1="175" x2="327" y2="130"/>
    <line x1="113" y1="175" x2="327" y2="175"/>
  </g>
  <g stroke="#c62828" stroke-width="3.5" stroke-linecap="round" fill="none">
    <line x1="113" y1="85" x2="327" y2="130"/>
    <line x1="113" y1="130" x2="327" y2="85"/>
    <line x1="113" y1="175" x2="327" y2="175"/>
  </g>
</svg>